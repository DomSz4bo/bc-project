[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-project"
version = "0.1.0"
description = "Visual-First development pipeline prototype"
requires-python = ">=3.12"
dependencies = [
    "chainlit",
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "langchain-mcp-adapters",
    "loguru",
    "prompt_toolkit",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
bc-cli = "cli.run_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]
