[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-project"
version = "1.0.0"
description = "Visual-First development pipeline prototype"
requires-python = ">=3.12"
dependencies = [
    "chainlit~=2.9.6",
    "langgraph>=1.1.3,<1.2.0",
    "langchain>=1.2.13,<1.3.0",
    "langchain-google-genai~=4.2.0",
    "langchain-mcp-adapters~=0.2.1",
    "loguru~=0.7.3",
    "prompt_toolkit~=3.0.52",
    "rich~=14.3.2",
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-mock~=3.15.1",
]

[project.scripts]
bc-cli = "cli.run_cli:main"
bc-app = "cli.run_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]
